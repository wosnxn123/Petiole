name: Dump applied sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Apply patches
        run: ./gradlew applyAllPatches --no-configuration-cache --no-daemon

      - name: Manually apply new feature patches (weaver skips them - investigating)
        run: |
          nms=petiole-server/src/minecraft/java
          cd "$nms"
          for p in "$GITHUB_WORKSPACE"/petiole-server/minecraft-patches/features/014*.patch "$GITHUB_WORKSPACE"/petiole-server/minecraft-patches/features/015*.patch "$GITHUB_WORKSPACE"/petiole-server/minecraft-patches/features/016*.patch "$GITHUB_WORKSPACE"/petiole-server/minecraft-patches/features/017*.patch; do
            subj=$(grep -m1 "^Subject:" "$p" | sed 's/Subject: \[PATCH\] //')
            if git log --format="%s" | grep -qxF "$subj"; then
              echo "already applied: $subj"
              continue
            fi
            if git am -q --3way --ignore-whitespace "$p"; then
              count=$((count+1))
            else
              echo "::warning::am failed: $(basename "$p")"
              git am --abort
            fi
          done
          echo "manually applied: $count"
          cd - >/dev/null


      - name: Diagnose server repo patch state
        run: |
          nms=petiole-server/src/minecraft/java
          if [ -d "$nms/.git" ]; then
            echo "== last 15 commits (applied patches) =="
            git -C "$nms" log --oneline -15 || true
            echo "== patch-apply logs =="
            tail -40 "$nms/.git/patch-apply-logs.log" 2>/dev/null || echo "no log file"
            if [ -e "$nms/.git/patch-apply-failed" ]; then echo "FAILED MARKER PRESENT"; else echo "no failed marker"; fi
          else
            echo "no .git in $nms"
            find petiole-server -maxdepth 3 -name ".git" -type d
          fi

      - name: Locate and verify applied sources
        id: locate
        run: |
          nms=petiole-server/src/minecraft/java
          main=petiole-server/src/main/java
          [ -f "$nms/net/minecraft/server/MinecraftServer.java" ] || { echo "::error::$nms missing"; exit 1; }
          [ -f "$main/io/canvasmc/canvas/GlobalConfiguration.java" ] || { echo "::error::$main missing"; exit 1; }
          echo "root=$nms" >> "$GITHUB_OUTPUT"
          echo "== sanity: batch-1 markers =="
          grep -c "nonFlushPacketSending" "$nms/net/minecraft/network/Connection.java" || echo "::error::batch-1 patches not applied"
          grep -c "disableRootWarning" "$nms/net/minecraft/server/dedicated/DedicatedServer.java" || echo "::error::batch-1 patches not applied"

      - name: Pack applied sources
        run: |
          mkdir stage
          cp -a petiole-server/src/minecraft/java/. stage/
          cp -a petiole-server/src/main/java/. stage/
          tar -czf applied-src.tar.gz -C stage .

      - name: Upload applied tree
        uses: actions/upload-artifact@v4
        with:
          name: applied-src
          path: applied-src.tar.gz
          retention-days: 7
