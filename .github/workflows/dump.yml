name: Dump applied sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Apply patches
        run: ./gradlew applyAllPatches --no-configuration-cache --no-daemon

      - name: Locate applied sources root
        id: locate
        run: |
          f=$(find . -type f -path "*net/minecraft/server/MinecraftServer.java" | head -1)
          if [ -z "$f" ]; then echo "::error::MinecraftServer.java not found"; exit 1; fi
          root="${f%net/minecraft/server/MinecraftServer.java}"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "Applied sources root: $root"
          ls "$root" | head -10

      - name: Pack applied sources
        run: tar -czf applied-src.tar.gz -C "${{ steps.locate.outputs.root }}" .

      - name: Upload applied tree
        uses: actions/upload-artifact@v4
        with:
          name: applied-src
          path: applied-src.tar.gz
          retention-days: 7
