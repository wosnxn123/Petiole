name: Debug GC dump

on:
  push:
    branches:
      - 'debug/gc-dump'

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JAVA_TOOL_OPTIONS: "-Xmx4G"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            .gradle/caches
            petiole-server/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Apply patches (tolerate failure)
        run: ./gradlew applyAllPatches --no-configuration-cache || true

      - name: Collect GlobalConfiguration variants
        run: |
          mkdir -p gcdump
          while IFS= read -r f; do
            rel="${f#./}"
            safe=$(echo "$rel" | tr '/' '_')
            cp "$f" "gcdump/$safe"
          done < <(find . -name GlobalConfiguration.java -type f)
          ls -la gcdump/

      - name: Upload dump
        uses: actions/upload-artifact@v4
        with:
          name: gcdump
          path: gcdump/
